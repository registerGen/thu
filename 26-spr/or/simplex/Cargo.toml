[package]
name = "simplex"
version = "0.1.0"
edition = "2024"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-rational = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
web = ["dep:serde", "dep:serde_json", "dep:wasm-bindgen"]

[lib]
crate-type = ["cdylib", "rlib"]
